<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b73ff" />
      <stop offset="100%" stop-color="#4a3aff" />
    </linearGradient>
  </defs>
  <!-- Background circle with sleek purple gradient -->
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <!-- Camera body -->
  <rect x="20" y="34" width="60" height="44" rx="8" fill="#ffffff" />
  <!-- Top bump / flash mount -->
  <path d="M36 34 L42 25 L58 25 L64 34 Z" fill="#ffffff" />
  <!-- Small flash/sensor light -->
  <circle cx="68" cy="43" r="3.5" fill="#e84057" />
  <!-- Outer lens ring -->
  <circle cx="50" cy="56" r="16" fill="#1e1e1e" />
  <!-- Inner lens glass -->
  <circle cx="50" cy="56" r="10" fill="url(#grad)" />
  <!-- Lens reflection -->
  <circle cx="47" cy="53" r="3" fill="#ffffff" opacity="0.8" />
